  --radius-lg: 16px;

  --shadow-card: 0 1px 2px rgba(20, 21, 25, 0.04), 0 6px 20px rgba(20, 21, 25, 0.04);

  --font: -apple-system, "PingFang SC", "SF Pro Text", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;

  --bg: var(--background-100);
  --surface: var(--background-50);
  --surface-2: var(--background-200);
  --line: var(--border);
  --line-2: var(--input);
  --accent: var(--primary);
  --accent-soft: var(--brand-50);
  --accent-deep: var(--brand-700);
}

  <script>
    const items = document.querySelectorAll('.tab-item');
    const glider = document.getElementById('glider');
    items.forEach((item) => {
      item.addEventListener('click', () => {
        items.forEach((i) => i.classList.remove('on'));
        item.classList.add('on');
        glider.style.transform = 'translateX(' + (item.dataset.index * 100) + '%)';
      });
    });
  </script>

    <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background-200);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 19.5;
      min-height: 600px;
      background: var(--bg);
      border-radius: 40px;
      box-shadow: 0 24px 70px rgba(20,21,25,0.12);
      position: relative;
      border: 10px solid var(--surface);
    }
    .screen {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 24px 18px 110px;
    }
    .screen::-webkit-scrollbar { display: none; }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
      animation: rise .45s cubic-bezier(.22,.61,.36,1) both;
    }
    .hero-left .title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .hero-left .sub { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
    .level {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; transition: transform .2s ease;
    }
    .level:active { transform: scale(0.94); }
    .level-badge {
      width: 54px; height: 54px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      background: var(--accent-soft); color: var(--accent-deep);
      box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 14%, transparent);
    }
    .level-cap { font-size: 10px; color: var(--ink-3); }

    .coach {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; margin-bottom: 14px;
      background: var(--ink); border-radius: var(--radius-l); color: var(--surface);
      animation: rise .45s .04s cubic-bezier(.22,.61,.36,1) both;
    }
    .coach-dot {
      flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
      animation: breathe 2.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
      50% { opacity: .55; box-shadow: 0 0 0 6px transparent; }
    }
    .coach-copy { flex: 1; min-width: 0; }
    .coach-eyebrow { font-size: 10px; letter-spacing: .12em; color: var(--text-400); }
    .coach-title { margin-top: 3px; font-size: 14px; font-weight: 700; }
    .coach-sub { margin-top: 2px; font-size: 11px; color: var(--text-300); }
    .coach-live {
      flex: none; padding: 2px 8px; border: 1px solid rgba(255,255,255,0.28);
      border-radius: var(--radius-pill); font-size: 9px; font-weight: 800; letter-spacing: .1em; color: var(--text-200);
    }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-l); box-shadow: var(--shadow-card);
      padding: 18px; margin: 10px 0;
      animation: rise .5s .08s cubic-bezier(.22,.61,.36,1) both;
      transition: transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .25s ease;
    }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-pop); }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .h-sec { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--ink-2);
    }
    .tag-accent { background: var(--accent-soft); color: var(--accent-deep); }
    .cap { font-size: 12px; color: var(--ink-3); }

    .focus {
      margin: 12px 0 4px; padding: 12px 14px;
      border-left: 3px solid var(--accent); background: var(--surface-2);
      border-radius: 0 var(--radius-m) var(--radius-m) 0;
    }
    .focus-kicker { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); }
    .focus-value { margin: 4px 0 2px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }

    .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .row-k { font-size: 13px; color: var(--ink-2); }
    .row-v { font-size: 14px; font-weight: 600; color: var(--ink); }

    .start-btn {
      width: 100%; margin-top: 16px; height: 48px; border-radius: var(--radius-pill);
      background: var(--ink); color: var(--surface); display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
      transition: transform .18s ease, opacity .18s ease, box-shadow .2s ease;
      cursor: pointer; position: relative; overflow: hidden; border: none;
    }
    .start-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: translateX(-100%); transition: transform .5s ease;
    }
    .start-btn:hover::after { transform: translateX(100%); }
    .start-btn:active { transform: scale(0.97); opacity: .92; }
    .start-btn:hover { box-shadow: 0 8px 20px rgba(20,21,25,0.12); }
    .start-arrow { transition: transform .2s ease; }
    .start-btn:hover .start-arrow { transform: translateX(4px); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 悬浮胶囊导航 ===== */
    .tabbar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      border: 1px solid color-mix(in srgb, var(--foreground) 6%, transparent);
      box-shadow: var(--shadow-float), inset 0 1px 0 color-mix(in srgb, var(--surface) 60%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .tabbar-inner { position: relative; display: flex; align-items: center; gap: 4px; }
    .tabbar-glider {
      position: absolute;
      top: 0; left: 0;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent-soft);
      box-shadow: 0 2px 8px rgba(11, 107, 232, 0.12);
      transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 0;
    }
    .tab-item {
      position: relative; z-index: 1;
      width: 48px; height: 48px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      color: var(--ink-3); border-radius: 50%;
      transition: color 0.25s ease, transform 0.15s ease;
      cursor: pointer; user-select: none;
    }
    .tab-item:active { transform: scale(0.92); }
    .tab-item.on { color: var(--accent-deep); }
    .tab-ico { width: 20px; height: 20px; flex-shrink: 0; transition: stroke-width 0.2s ease; }
    .tab-item.on .tab-ico { stroke-width: 2; }
    .tab-label {
      font-size: 8.5px; font-weight: 700; letter-spacing: 0.02em; line-height: 1;
      opacity: 0.7; transition: opacity 0.25s ease;
    }
    .tab-item.on .tab-label { opacity: 1; }
  </style>
