<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韩语伙伴 · 登录页预览</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background-200);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 19.5;
      min-height: 600px;
      background:
        radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--primary) 8%, transparent) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 80%, color-mix(in srgb, var(--primary) 6%, transparent) 0%, transparent 40%),
        var(--bg);
      border-radius: 40px;
      box-shadow: 0 24px 70px rgba(20,21,25,0.12);
      position: relative;
      border: 10px solid var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
    }
    .phone-blob {
      position: absolute;
      width: 420px; height: 420px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--primary) 5%, transparent) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .brand { text-align: center; margin-bottom: 36px; position: relative; z-index: 1; }
    .brand-mark {
      width: 58px; height: 58px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-size: 28px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 24%, transparent);
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
    }
    .brand-mark span { position: relative; z-index: 1; }
    .brand-title { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
    .brand-sub { margin-top: 7px; font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em; }

    .login-card {
      width: 100%;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border: 1px solid color-mix(in srgb, var(--foreground) 6%, transparent);
      border-radius: var(--radius-l);
      box-shadow: 0 1px 2px rgba(20,21,25,0.04), 0 24px 60px rgba(20,21,25,0.08);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 22px 22px 18px;
      position: relative; z-index: 1;
    }

    .mode-tabs {
      position: relative;
      display: flex;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      padding: 3px;
      margin-bottom: 22px;
    }
    .mode-pill {
      position: absolute;
      top: 3px; left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      background: var(--surface);
      border-radius: var(--radius-pill);
      box-shadow: 0 1px 4px rgba(20,21,25,0.08);
      transition: transform .3s cubic-bezier(.22,.61,.36,1);
      z-index: 0;
    }
    .mode-tab {
      position: relative; z-index: 1;
      flex: 1; text-align: center;
      padding: 8px 0;
      border-radius: var(--radius-pill);
      font-size: 14px; font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      transition: color .25s ease;
    }
    .mode-on { color: var(--ink); }

    .field { margin-bottom: 15px; }
    .field-label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-m);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      outline: none;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:hover { border-color: var(--line-2); }
    .field-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 13px 0;
      border-radius: var(--radius-pill);
      background: var(--ink);
      color: #fff;
      font-size: 15px; font-weight: 600;
      letter-spacing: 0.04em;
      transition: transform .18s ease, opacity .18s ease, box-shadow .2s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      transform: translateX(-100%); transition: transform .5s ease;
    }
    .submit-btn:hover::after { transform: translateX(100%); }
    .submit-btn:hover { box-shadow: 0 8px 20px rgba(20,21,25,0.12); }
    .submit-btn:active { transform: scale(0.98); opacity: .92; }

    .login-hint { margin-top: 14px; text-align: center; font-size: 12px; color: var(--ink-3); line-height: 1.5; }

    .login-foot { margin-top: 32px; font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em; position: relative; z-index: 1; }

    .rise { opacity: 0; animation: rise-in .6s cubic-bezier(.22,.61,.36,1) forwards; }
    .rise-1 { animation-delay: .05s; }
    .rise-2 { animation-delay: .15s; }
    .rise-3 { animation-delay: .25s; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="phone-blob"></div>

    <div class="brand rise rise-1">
      <div class="brand-mark"><span>한</span></div>
      <div class="brand-title">한국어 친구</div>
      <div class="brand-sub">韩语伙伴 · AI 口语教练</div>
    </div>

    <div class="login-card rise rise-2">
      <div class="mode-tabs">
        <div class="mode-pill" id="modePill"></div>
        <button class="mode-tab mode-on" data-mode="login">登录</button>
        <button class="mode-tab" data-mode="register">注册</button>
      </div>

      <div class="field">
        <label class="field-label">用户名</label>
        <input class="field-input" type="text" placeholder="3-20 位字母、数字或下划线" />
      </div>
      <div class="field">
        <label class="field-label">密码</label>
        <input class="field-input" type="password" placeholder="至少 6 位" />
      </div>

      <button class="submit-btn">登录</button>

      <div class="login-hint">还没有账号？切换到「注册」创建一个</div>
    </div>

    <div class="login-foot rise rise-3">오늘도 수고했어요 · 今天也加油</div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.mode-tab');
    const pill = document.getElementById('modePill');
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('mode-on'));
        tab.classList.add('mode-on');
        pill.style.transform = tab.dataset.mode === 'login' ? 'translateX(0)' : 'translateX(100%)';
      });
    });
  </script>
</body>
</html>
