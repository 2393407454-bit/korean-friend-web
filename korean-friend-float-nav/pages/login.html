    <style id="theme-vars">
/*
 * Korean Friend App — floating nav showcase tokens
 * Style: Minimal, premium, Apple-inspired
 */

:root {
  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff;
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: #ff3b30;
  --destructive-foreground: #ffffff;
  --success: #34c759;
  --success-foreground: #ffffff;
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  /* shadow */
  --shadow-card: 0 1px 2px rgba(20, 21, 25, 0.04), 0 6px 20px rgba(20, 21, 25, 0.04);
  --shadow-pop:  0 4px 12px rgba(20, 21, 25, 0.04), 0 16px 40px rgba(20, 21, 25, 0.05);
  --shadow-float: 0 6px 24px rgba(20, 21, 25, 0.06), 0 20px 48px rgba(20, 21, 25, 0.08);

  /* font */
  --font: -apple-system, "PingFang SC", "SF Pro Text", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;

  /* compatibility aliases for the showcase page */
  --ink: var(--text-800);
  --ink-2: var(--text-500);
  --ink-3: var(--text-400);
  --bg: var(--background-100);
  --surface: var(--background-50);
  --surface-2: var(--background-200);
  --line: var(--border);
  --line-2: var(--input);
  --accent: var(--primary);
  --accent-soft: var(--brand-50);
  --accent-deep: var(--brand-700);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body>
  <div class="phone">
    <div class="phone-blob"></div>

    <div class="brand rise rise-1">
      <div class="brand-mark"><span>한</span></div>
      <div class="brand-title">한국어 친구</div>
      <div class="brand-sub">韩语伙伴 · AI 口语教练</div>
    </div>

    <div class="login-card rise rise-2">
      <div class="mode-tabs">
        <div class="mode-pill" id="modePill"></div>
        <button class="mode-tab mode-on" data-mode="login">登录</button>
        <button class="mode-tab" data-mode="register">注册</button>
      </div>

      <div class="field">
        <label class="field-label">用户名</label>
        <input class="field-input" type="text" placeholder="3-20 位字母、数字或下划线" />
      </div>
      <div class="field">
        <label class="field-label">密码</label>
        <input class="field-input" type="password" placeholder="至少 6 位" />
      </div>

      <button class="submit-btn">登录</button>

      <div class="login-hint">还没有账号？切换到「注册」创建一个</div>
    </div>

    <div class="login-foot rise rise-3">오늘도 수고했어요 · 今天也加油</div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.mode-tab');
    const pill = document.getElementById('modePill');
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('mode-on'));
        tab.classList.add('mode-on');
        pill.style.transform = tab.dataset.mode === 'login' ? 'translateX(0)' : 'translateX(100%)';
      });
    });
  </script>

    <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background-200);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 19.5;
      min-height: 600px;
      background:
        radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--primary) 8%, transparent) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 80%, color-mix(in srgb, var(--primary) 6%, transparent) 0%, transparent 40%),
        var(--bg);
      border-radius: 40px;
      box-shadow: 0 24px 70px rgba(20,21,25,0.12);
      position: relative;
      border: 10px solid var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
    }
    .phone-blob {
      position: absolute;
      width: 420px; height: 420px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--primary) 5%, transparent) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .brand { text-align: center; margin-bottom: 36px; position: relative; z-index: 1; }
    .brand-mark {
      width: 58px; height: 58px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-size: 28px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 24%, transparent);
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
    }
    .brand-mark span { position: relative; z-index: 1; }
    .brand-title { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
    .brand-sub { margin-top: 7px; font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em; }

    .login-card {
      width: 100%;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border: 1px solid color-mix(in srgb, var(--foreground) 6%, transparent);
      border-radius: var(--radius-l);
      box-shadow: 0 1px 2px rgba(20,21,25,0.04), 0 24px 60px rgba(20,21,25,0.08);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 22px 22px 18px;
      position: relative; z-index: 1;
    }

    .mode-tabs {
      position: relative;
      display: flex;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      padding: 3px;
      margin-bottom: 22px;
    }
    .mode-pill {
      position: absolute;
      top: 3px; left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      background: var(--surface);
      border-radius: var(--radius-pill);
      box-shadow: 0 1px 4px rgba(20,21,25,0.08);
      transition: transform .3s cubic-bezier(.22,.61,.36,1);
      z-index: 0;
    }
    .mode-tab {
      position: relative; z-index: 1;
      flex: 1; text-align: center;
      padding: 8px 0;
      border-radius: var(--radius-pill);
      font-size: 14px; font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      transition: color .25s ease;
    }
    .mode-on { color: var(--ink); }

    .field { margin-bottom: 15px; }
    .field-label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-m);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      outline: none;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:hover { border-color: var(--line-2); }
    .field-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 13px 0;
      border-radius: var(--radius-pill);
      background: var(--ink);
      color: #fff;
      font-size: 15px; font-weight: 600;
      letter-spacing: 0.04em;
      transition: transform .18s ease, opacity .18s ease, box-shadow .2s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      transform: translateX(-100%); transition: transform .5s ease;
    }
    .submit-btn:hover::after { transform: translateX(100%); }
    .submit-btn:hover { box-shadow: 0 8px 20px rgba(20,21,25,0.12); }
    .submit-btn:active { transform: scale(0.98); opacity: .92; }

    .login-hint { margin-top: 14px; text-align: center; font-size: 12px; color: var(--ink-3); line-height: 1.5; }

    .login-foot { margin-top: 32px; font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em; position: relative; z-index: 1; }

    .rise { opacity: 0; animation: rise-in .6s cubic-bezier(.22,.61,.36,1) forwards; }
    .rise-1 { animation-delay: .05s; }
    .rise-2 { animation-delay: .15s; }
    .rise-3 { animation-delay: .25s; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
